<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#101018"/>
      <rect width="6" height="6" fill="#151520"/>
      <rect x="6" y="6" width="6" height="6" fill="#151520"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#carbon)" opacity="0.35"/>
  <circle cx="400" cy="280" r="190" fill="#a3e635" opacity="0.06"/>
  <!-- monster truck body -->
  <path d="M250 265 L285 215 Q295 200 315 200 L455 200 Q475 200 490 218 L540 265 Z" fill="#1b1b26" stroke="#a3e635" stroke-width="6"/>
  <rect x="235" y="262" width="330" height="42" rx="12" fill="#1b1b26" stroke="#a3e635" stroke-width="6"/>
  <rect x="330" y="212" width="80" height="42" rx="8" fill="#a3e635" opacity="0.22"/>
  <!-- big wheels -->
  <circle cx="305" cy="340" r="62" fill="#16161f" stroke="#2c2c3a" stroke-width="18"/>
  <circle cx="305" cy="340" r="62" fill="none" stroke="#a3e635" stroke-width="4"/>
  <circle cx="305" cy="340" r="18" fill="#a3e635"/>
  <circle cx="495" cy="340" r="62" fill="#16161f" stroke="#2c2c3a" stroke-width="18"/>
  <circle cx="495" cy="340" r="62" fill="none" stroke="#a3e635" stroke-width="4"/>
  <circle cx="495" cy="340" r="18" fill="#a3e635"/>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8e8ef" letter-spacing="6">OFF-ROAD RC TRUCK</text>
  <text x="400" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a" letter-spacing="4">RC DRIFTER NP</text>
</svg>
