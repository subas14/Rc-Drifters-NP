  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8e8ef" letter-spacing="6">2.4GHZ CONTROLLER</text>
  <text x="400" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a" letter-spacing="4">RC DRIFTER NP</text>
</svg>
