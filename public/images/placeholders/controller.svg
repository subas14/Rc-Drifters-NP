<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#101018"/>
      <rect width="6" height="6" fill="#151520"/>
      <rect x="6" y="6" width="6" height="6" fill="#151520"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#carbon)" opacity="0.35"/>
  <circle cx="400" cy="280" r="180" fill="#22d3ee" opacity="0.06"/>
  <!-- pistol-grip transmitter -->
  <rect x="345" y="150" width="110" height="120" rx="22" fill="#1b1b26" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="400" cy="210" r="34" fill="none" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="400" cy="210" r="12" fill="#22d3ee"/>
  <rect x="372" y="270" width="56" height="120" rx="16" fill="#1b1b26" stroke="#22d3ee" stroke-width="5"/>
  <path d="M372 320 Q330 330 336 366 L372 380 Z" fill="#1b1b26" stroke="#22d3ee" stroke-width="5"/>
  <!-- antenna -->
  <line x1="452" y1="152" x2="500" y2="96" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.8">
    <path d="M508 88 q14 12 6 30"/>
    <path d="M524 74 q22 20 10 48"/>
