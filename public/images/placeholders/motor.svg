<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#101018"/>
      <rect width="6" height="6" fill="#151520"/>
      <rect x="6" y="6" width="6" height="6" fill="#151520"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#carbon)" opacity="0.35"/>
  <circle cx="400" cy="280" r="180" fill="#ff2d37" opacity="0.07"/>
  <!-- motor can -->
  <rect x="290" y="215" width="200" height="130" rx="20" fill="#1b1b26" stroke="#ff2d37" stroke-width="6"/>
  <g stroke="#2c2c3a" stroke-width="6">
    <line x1="320" y1="215" x2="320" y2="345"/>
    <line x1="360" y1="215" x2="360" y2="345"/>
    <line x1="400" y1="215" x2="400" y2="345"/>
    <line x1="440" y1="215" x2="440" y2="345"/>
  </g>
  <!-- shaft + pinion -->
  <rect x="490" y="266" width="54" height="16" rx="8" fill="#ff2d37"/>
  <circle cx="562" cy="274" r="26" fill="none" stroke="#ff7a18" stroke-width="8" stroke-dasharray="8 7"/>
  <!-- wires -->
  <path d="M290 240 q-46 -8 -60 -46" stroke="#ff2d37" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M290 320 q-50 8 -64 44" stroke="#22d3ee" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8e8ef" letter-spacing="6">RC SPARE MOTOR</text>
  <text x="400" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a" letter-spacing="4">RC DRIFTER NP</text>
</svg>
