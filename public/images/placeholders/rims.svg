<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#101018"/>
      <rect width="6" height="6" fill="#151520"/>
      <rect x="6" y="6" width="6" height="6" fill="#151520"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#carbon)" opacity="0.35"/>
  <circle cx="400" cy="275" r="180" fill="#22d3ee" opacity="0.06"/>
  <!-- rim -->
  <circle cx="400" cy="275" r="115" fill="#16161f" stroke="#22d3ee" stroke-width="8"/>
  <circle cx="400" cy="275" r="90" fill="none" stroke="#2c2c3a" stroke-width="4"/>
  <circle cx="400" cy="275" r="22" fill="#1b1b26" stroke="#22d3ee" stroke-width="6"/>
  <!-- 6 spokes -->
  <g stroke="#22d3ee" stroke-width="12" stroke-linecap="round">
    <line x1="400" y1="253" x2="400" y2="172"/>
    <line x1="419" y1="286" x2="489" y2="326"/>
    <line x1="381" y1="286" x2="311" y2="326"/>
    <line x1="400" y1="297" x2="400" y2="378"/>
    <line x1="419" y1="264" x2="489" y2="224"/>
    <line x1="381" y1="264" x2="311" y2="224"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8e8ef" letter-spacing="6">WHEEL RIM SET</text>
  <text x="400" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a" letter-spacing="4">RC DRIFTER NP</text>
</svg>
