<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#101018"/>
      <rect width="6" height="6" fill="#151520"/>
      <rect x="6" y="6" width="6" height="6" fill="#151520"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#carbon)" opacity="0.35"/>
  <circle cx="400" cy="290" r="180" fill="#ff7a18" opacity="0.07"/>
  <!-- three cones -->
  <g>
    <path d="M290 350 L318 245 L346 350 Z" fill="#ff7a18"/>
    <rect x="300" y="298" width="36" height="14" fill="#f5f5f7"/>
    <rect x="272" y="350" width="92" height="16" rx="6" fill="#1b1b26" stroke="#ff7a18" stroke-width="4"/>
  </g>
  <g>
    <path d="M372 372 L400 240 L428 372 Z" fill="#ff7a18"/>
    <rect x="382" y="308" width="36" height="16" fill="#f5f5f7"/>
    <rect x="352" y="372" width="96" height="16" rx="6" fill="#1b1b26" stroke="#ff7a18" stroke-width="4"/>
  </g>
  <g>
    <path d="M454 350 L482 245 L510 350 Z" fill="#ff7a18"/>
    <rect x="464" y="298" width="36" height="14" fill="#f5f5f7"/>
    <rect x="436" y="350" width="92" height="16" rx="6" fill="#1b1b26" stroke="#ff7a18" stroke-width="4"/>
  </g>
  <!-- drift line -->
  <path d="M240 420 q80 24 160 0 t160 0" stroke="#3a3a4c" stroke-width="6" fill="none" stroke-dasharray="14 12"/>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8e8ef" letter-spacing="6">DRIFT TRACK CONES</text>
  <text x="400" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a" letter-spacing="4">RC DRIFTER NP</text>
</svg>
