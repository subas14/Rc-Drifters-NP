<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#101018"/>
      <rect width="6" height="6" fill="#151520"/>
      <rect x="6" y="6" width="6" height="6" fill="#151520"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#carbon)" opacity="0.35"/>
  <circle cx="400" cy="280" r="180" fill="#ff7a18" opacity="0.07"/>
  <!-- tyre -->
  <circle cx="400" cy="275" r="120" fill="#16161f" stroke="#2c2c3a" stroke-width="30"/>
  <circle cx="400" cy="275" r="120" fill="none" stroke="#ff7a18" stroke-width="4"/>
  <circle cx="400" cy="275" r="58" fill="#1b1b26" stroke="#ff7a18" stroke-width="4"/>
  <g stroke="#ff7a18" stroke-width="8" stroke-linecap="round">
    <line x1="400" y1="275" x2="400" y2="225"/>
    <line x1="400" y1="275" x2="443" y2="300"/>
    <line x1="400" y1="275" x2="357" y2="300"/>
  </g>
  <!-- tread marks -->
  <g stroke="#3a3a4c" stroke-width="6" stroke-linecap="round">
    <line x1="400" y1="141" x2="400" y2="163"/>
    <line x1="495" y1="180" x2="479" y2="196"/>
    <line x1="534" y1="275" x2="512" y2="275"/>
    <line x1="495" y1="370" x2="479" y2="354"/>
    <line x1="400" y1="409" x2="400" y2="387"/>
    <line x1="305" y1="370" x2="321" y2="354"/>
    <line x1="266" y1="275" x2="288" y2="275"/>
    <line x1="305" y1="180" x2="321" y2="196"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8e8ef" letter-spacing="6">DRIFT TYRE SET</text>
  <text x="400" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8a8a9a" letter-spacing="4">RC DRIFTER NP</text>
</svg>
